name: daily-post-v2

# v2 is the live daily poster. Scheduled runs publish; manual runs publish only when ticked.
on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST daily
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Instagram + Facebook (false = render and commit only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (needed for the Reel)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r requirements-v2.txt

      - run: playwright install --with-deps chromium

      - name: Generate 3-slide carousel (hook -> write -> lint -> render -> QA)
        run: python -m agent_v2.pipeline
        env:
          # auto = take the next post from content_queue/ (no API call). Only if the queue is empty does it
          # write ONE post with the API, capped at 2 calls.
          CONTENT_SOURCE: auto
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_API_CALLS_PER_RUN: "2"
          MONTHLY_BUDGET_USD: "3"

      - name: Keep the Reel for review (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: public/posts_v2/*/reel.mp4
          retention-days: 7

      - name: Commit slides so they are publicly reachable
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily carousel (agent v2)"
          file_pattern: "public/posts_v2/*.json public/posts_v2/*/*.jpg data/api_usage.jsonl"

      - name: Publish carousel to Instagram + Facebook
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: python publish_v2.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_BRANCH: ${{ github.ref_name }}

      - name: Save publish ids back to the repo
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish) }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Record published media ids (agent v2)"
          file_pattern: "public/posts_v2/*.json"
