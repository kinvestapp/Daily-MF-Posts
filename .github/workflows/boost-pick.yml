name: boost-pick

# On the 1st and 15th: the agent opens an issue naming the post to boost (owner approved 2 boosts a month).
on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Pick now even if today is not the 1st or 15th"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Pick the post to boost
        run: python -m agent_v2.boost
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
