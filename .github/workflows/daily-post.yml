name: daily-content-post

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST daily
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Generate content and render image
        run: python generate_and_render.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push image so it's publicly reachable
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily post image"
          file_pattern: "public/posts/*"

      - name: Publish to Instagram + Facebook
        run: python publish.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
