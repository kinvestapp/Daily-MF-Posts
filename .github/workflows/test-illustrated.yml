name: test-illustrated-content

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-illustrated.txt
      - run: playwright install --with-deps chromium
      - name: Generate illustrated test post
        run: python generate_and_render_illustrated.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit test image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Test illustrated post"
          file_pattern: "public/posts_test/*"
