<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; width:1080px; height:1080px; background:#F0E6D2; font-family:Georgia, serif; }
  .frame { box-sizing:border-box; width:1040px; height:1040px; margin:20px; border:6px solid #B8860B; padding:50px; position:relative; background:#F5EEDD; }
  .logo { display:block; margin:0 auto 30px auto; height:180px; }
  .headline { color:#1B2A56; font-size:52px; text-align:center; line-height:1.3; margin-bottom:35px; font-weight:bold; }
  .body-text { color:#3A3226; font-size:28px; text-align:center; line-height:1.5; }
  .footer { position:absolute; bottom:40px; left:60px; right:60px; text-align:center; color:#6B5D3F; font-size:16px; border-top:2px solid #B8860B; padding-top:20px; }
</style>
</head>
<body>
  <div class="frame">
    <img class="logo" src="{{LOGO_PATH}}" />
    <div class="headline">{{HEADLINE}}</div>
    <div class="body-text">{{BODY}}</div>
    <div class="footer">ARN-366802 | AMFI-registered Mutual Fund Distributor | www.assetplus.in/mfd/ARN-366802 | Mutual Fund investments are subject to market risks, read all scheme related documents carefully</div>
  </div>
</body>
</html>
