<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; width:1080px; height:1080px; }
  .frame { width:1080px; height:1080px; position:relative; overflow:hidden; }
  .illustration { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  .logo { position:absolute; top:50px; right:50px; height:80px; z-index:2; }
  .text-zone { position:absolute; bottom:130px; left:0; width:100%; box-sizing:border-box; padding:0 90px; text-align:center; z-index:2; }
  .headline { font-family:'Kalam', cursive; font-weight:700; color:#1B2A56; font-size:44px; line-height:1.25; margin-bottom:14px; }
  .body-text { font-family:'Kalam', cursive; font-weight:400; color:#3A3226; font-size:25px; line-height:1.4; }
  .footer { position:absolute; bottom:50px; left:0; width:100%; box-sizing:border-box; text-align:center; color:#6B5D3F; padding:0 90px; z-index:2; font-family:Georgia, serif; }
  .footer-line1 { font-size:14px; margin-bottom:3px; }
  .footer-line2 { font-size:12px; }
</style>
</head>
<body>
  <div class="frame">
    <img class="illustration" src="{{ILLUSTRATION_PATH}}" />
    <img class="logo" src="{{LOGO_PATH}}" />
    <div class="text-zone">
      <div class="headline">{{HEADLINE}}</div>
      <div class="body-text">{{BODY}}</div>
    </div>
    <div class="footer">
      <div class="footer-line1">ARN-366802 | AMFI-registered Mutual Fund Distributor | www.assetplus.in/mfd/ARN-366802</div>
      <div class="footer-line2">Mutual Fund investments are subject to market risks, read all scheme related documents carefully</div>
    </div>
  </div>
</body>
</html>
